name: Validate repository

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check capture error handling
        run: python3 -m unittest discover -s verification -p test_run_professional_examples.py
      - name: Check published examples
        run: python3 site/build-examples.py --check
      - name: Check design boundaries
        run: python3 site/check-design.py

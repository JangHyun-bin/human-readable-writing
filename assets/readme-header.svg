<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Human-readable writing</title>
  <desc id="desc">Keep the terms. Make the relationships clear. Who acts, under what conditions, and what remains uncertain?</desc>
  <rect width="1200" height="380" rx="12" fill="#f5f1e8"/>
  <rect x="0" y="0" width="8" height="380" rx="4" fill="#b34c35"/>
  <g fill="#1e303b">
    <text x="56" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2">TECHNICAL WRITING · CODEX / CLAUDE CODE</text>
    <text x="52" y="151" font-family="Georgia, 'Times New Roman', serif" font-size="73" letter-spacing="-2">Human-readable</text>
    <text x="52" y="231" font-family="Georgia, 'Times New Roman', serif" font-size="82" letter-spacing="-2">writing.</text>
    <text x="56" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">Keep the terms. Make the relationships clear.</text>
  </g>
  <path d="M56 325 H1144" stroke="#d7d0c4"/>
  <text x="56" y="353" fill="#59616a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.8">TERMS · FACTS · CONDITIONS · UNCERTAINTY</text>
  <g transform="translate(817 95)">
    <path d="M0 0 V188" stroke="#d7d0c4"/>
    <g fill="#1e303b" font-family="Georgia, 'Times New Roman', serif" font-size="23">
      <text x="36" y="23">Who acts?</text>
      <text x="36" y="87">Under what conditions?</text>
      <text x="36" y="151">What remains uncertain?</text>
    </g>
    <g fill="none" stroke="#b34c35" stroke-width="2">
      <path d="M36 35 H132"/>
      <path d="M36 99 H260"/>
      <path d="M36 163 H277"/>
    </g>
  </g>
</svg>

name: Install or invocation problem (설치·호출 문제)
description: The skill does not install, the runtime does not find it, or calling it does not load it.
title: "[Install]: "
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Remove tokens, credentials, private repository names, and personal data from commands, paths, and logs. Replace your home directory with `~`. You can write in English or Korean.

        Issue는 공개됩니다. 명령, 경로, 로그에서 토큰, 인증정보, 비공개 저장소 이름, 개인정보를 지워 주세요. 홈 디렉터리 경로는 `~`로 바꿔 주세요. 영어나 한국어로 작성하실 수 있습니다.
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Codex
        - Claude Code
        - Pi
        - oh-my-pi
        - OpenCode
        - Other
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      description: "For example, the output of `codex --version` or `claude --version`."
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - skills CLI, project scope
        - skills CLI, user scope (-g)
        - Manual clone and link
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Node.js version
      description: "Include the output of `node --version` if you used the skills CLI."
      placeholder: "macOS 26.1, Node.js 22.20.0"
  - type: textarea
    id: commands
    attributes:
      label: Commands
      description: The install command you ran and the request you typed to call the skill.
      render: shell
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened
      description: "Paste the error or the relevant output. Say whether the installed `human-readable-writing` directory contains `SKILL.md`, and whether the runtime lists the skill."
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: I started a new session after installing.
        - label: "I removed credentials, private names, and personal data. (인증정보, 비공개 이름, 개인정보를 지웠습니다.)"
          required: true
